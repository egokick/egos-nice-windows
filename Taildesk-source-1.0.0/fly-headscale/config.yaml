server_url: "https://taildesk-egokick-control.fly.dev"
listen_addr: "127.0.0.1:8081"
metrics_listen_addr: "127.0.0.1:9090"
grpc_listen_addr: "127.0.0.1:50443"
grpc_allow_insecure: false

tls_cert_path: ""
tls_key_path: ""
trusted_proxies:
  - "127.0.0.1/32"

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
allocation: sequential

derp:
  server:
    enabled: true
    region_id: 910
    region_code: "taildesk-fly"
    region_name: "Taildesk private Fly relay"
    verify_clients: true
    stun_listen_addr: "fly-global-services:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: "213.188.217.227"
    ipv6: "2a09:8280:1::15f:2c41:0"
  # Do not load Tailscale Inc.'s relay map. Taildesk uses only this deployment.
  urls: []
  paths: []
  auto_update_enabled: false

node:
  # Durable non-ephemeral nodes never expire merely because a machine is off.
  expiry: 0

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: json

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: false
  base_domain: "taildesk.invalid"
  override_local_dns: false
  nameservers:
    global: []
  search_domains: []
  extra_records: []

unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: false

auto_update:
  enabled: false
disable_check_updates: true

