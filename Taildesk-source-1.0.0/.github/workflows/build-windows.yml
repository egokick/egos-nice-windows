name: Build Windows packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
      - 'build.ps1'
      - 'installer/**'
      - 'config/**'

jobs:
  build:
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem installer -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: Taildesk-CommandCenter-${{ matrix.runtime }}
          path: dist/Taildesk-CommandCenter-${{ matrix.runtime }}.zip
          if-no-files-found: error
