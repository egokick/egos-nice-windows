[supervisord]
nodaemon=true
logfile=/var/log/stayactive/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/stayactive/supervisord.pid
childlogdir=/var/log/stayactive

[supervisorctl]
serverurl=unix:///run/stayactive/supervisor.sock

[unix_http_server]
file=/run/stayactive/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=5
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/dbus.log
stderr_logfile=/var/log/stayactive/dbus.err.log

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
priority=10
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/xvfb.log
stderr_logfile=/var/log/stayactive/xvfb.err.log

[program:openbox]
command=/usr/bin/openbox-session
user=chrome
environment=HOME="/home/chrome",DISPLAY=":99"
priority=20
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/openbox.log
stderr_logfile=/var/log/stayactive/openbox.err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -rfbport 5900 -nopw
priority=30
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/x11vnc.log
stderr_logfile=/var/log/stayactive/x11vnc.err.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/novnc.log
stderr_logfile=/var/log/stayactive/novnc.err.log

[program:passkey-test]
command=/usr/bin/python3 -m http.server 8000 --bind 127.0.0.1 --directory /opt/stayactive/test
priority=40
autorestart=true
startsecs=1
stdout_logfile=/var/log/stayactive/passkey-test.log
stderr_logfile=/var/log/stayactive/passkey-test.err.log

[program:bluetoothd]
command=/usr/libexec/bluetooth/bluetoothd --nodetach
priority=50
; Explicit supervisorctl stop remains stopped during a laptop handoff, while
; an unexpected BlueZ exit is recovered automatically.
autorestart=unexpected
startretries=3
startsecs=1
stdout_logfile=/var/log/stayactive/bluetoothd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/stayactive/bluetoothd.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:chrome]
command=/opt/stayactive/run-chrome.sh
user=chrome
environment=HOME="/home/chrome",DISPLAY=":99"
priority=60
autorestart=true
startretries=10
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/var/log/stayactive/chrome.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/stayactive/chrome.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3

[program:keepalive]
command=/usr/bin/python3 /opt/stayactive/stayactive-keepalive.py
priority=70
autorestart=true
startsecs=5
stdout_logfile=/var/log/stayactive/keepalive.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/stayactive/keepalive.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
